# La langue du `values/` sans qualificatif.
#
# C'est ce qu'AGP a besoin de savoir pour ecrire `locales_config.xml` : sans cette
# ligne, il ne peut pas dire au systeme quelle langue portent les ressources par
# defaut, et le selecteur d'Android proposerait une langue de moins que l'application
# n'en parle.
#
# `en` et non `fr` : depuis D129, c'est l'anglais qui occupe le bucket sans
# qualificatif, et le francais qui vit dans `values-fr/`. C'est ce qui fait qu'un
# appareil regle en allemand tombe sur de l'anglais, sans qu'aucun code ne le decide.
unqualifiedResLocale=en
