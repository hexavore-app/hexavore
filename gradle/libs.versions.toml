# Catalogue de versions : la seule source de verite des versions du projet.
#
# Regle tenue par la revue et par la CI : aucun numero de version dans un
# build.gradle.kts. Une montee de version se lit alors dans un diff de ce
# fichier, et pas dans huit endroits qu'on oublie d'aligner.

[versions]

# --- Chaine de construction ---------------------------------------------------
# AGP 8.7 est le dernier palier que comprend Android Studio Ladybug (2024.2.1),
# l'IDE de la machine de developpement. Voir D15 dans docs/11-decisions.md pour
# le raisonnement et le chemin de montee.
agp = "8.11.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# --- Plateforme Android -------------------------------------------------------
# minSdk 26 : docs/01-perimetre.md (java.time, Keystore, notifications).
#
# targetSdk 36 parce que le Play Store l'exige d'une nouvelle application depuis le
# 31 aout 2026, et compileSdk avec lui : docs/11-decisions.md, D128.
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
jvmToolchain = "17"

# --- Identite de l'application ------------------------------------------------
# applicationId verrouille a la premiere publication Play : docs/10-qualite-et-livraison.md.
versionName = "0.6.0"
versionCode = "1"

# --- Bibliotheques ------------------------------------------------------------
androidxCore = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.10.01"
coroutines = "1.9.0"
# Le palier qui accompagne Kotlin 2.0.21. Il fournit l'annotation @Serializable et
# le format que la navigation typee utilise pour ses arguments.
serialization = "1.7.3"
# 2.8 est le premier palier a routes typees : une destination est une data class
# @Serializable, et une faute d'argument devient une erreur de compilation.
navigation = "2.8.4"
room = "2.6.1"
hilt = "2.53.1"
hiltNavigationCompose = "1.2.0"

# Retrofit 2 et OkHttp 4, pas les paliers 3 et 5 : ces deux-la vont ensemble et
# demandent une chaine de construction plus recente que celle que D15 a fixee sur
# l'IDE installe. Le client n'a qu'un GET a passer ; rien dans ce module ne motive
# de sortir du palier eprouve.
retrofit = "2.11.0"
okhttp = "4.12.0"

# CameraX 1.4 est le dernier palier qui se compile sous compileSdk 35 ; les 1.5 et
# au-dela en demandent un plus recent, que D15 a fixe sur l'IDE installe.
camerax = "1.4.2"
# Le decodeur de codes-barres est **libre** : zxing-cpp, et non ML Kit, qui envoyait
# a Google des diagnostics qu'aucun reglage ne coupait (D123). Il tourne entierement
# sur l'appareil, sans reseau ni services Google, donc sur un telephone degooglise
# comme sur un autre. La 2.3.0 est la derniere qui s'accorde a la chaine de D15 :
# les 3.x tirent CameraX 1.5 et Kotlin 2.2, donc compileSdk 36.
zxingCpp = "2.3.0"

# Calendrier Compose, licence MIT. WeekCalendar et VerticalCalendar sont batis sur
# LazyRow et LazyColumn : la pagination des mois, le premier jour de semaine selon la
# locale et les debordements de mois viennent avec, et ce sont precisement les regles
# qu'on croit simples et qu'on corrige trois fois.
#
# **2.6.2 et non la derniere.** Les paliers 2.9 et au-dela sont compiles avec Kotlin
# 2.2 puis 2.3, que le compilateur de ce projet ne sait pas lire -- et monter Kotlin a
# 2.3 casserait detekt 1.23.8, qui ne lit pas ses metadonnees. Ce palier-ci offre deja
# les deux calendriers dont l'ecran a besoin : la montee n'apporterait rien ici et
# couterait la reecriture des trois regles maison contre une API alpha. Voir D93.
kizitonwoseCalendar = "2.6.2"

# --- Qualite ------------------------------------------------------------------
detekt = "1.23.8"
ktlintPlugin = "12.1.2"
ktlint = "1.3.1"
junit = "5.11.3"
junitPlatform = "1.11.3"
# JUnit 4 n'est pas un retour en arriere : MigrationTestHelper de Room est une
# regle JUnit 4, et le moteur vintage la fait tourner sous la plateforme JUnit 5
# deja en place. Deux moteurs, une seule commande.
junit4 = "4.13.2"
robolectric = "4.14"
androidxTest = "1.6.1"

# --- Outillage hors APK -------------------------------------------------------
# Pilote SQLite pour la JVM de developpement : il embarque sa propre compilation de
# SQLite, celle qui ecrit ciqual.db. Il n'entre dans aucun APK.
sqliteJdbc = "3.47.1.0"

# SDK Anthropic, pour la seule tache `generateShortNames`. Hors APK lui aussi : les
# six fournisseurs de l'application passent par Retrofit et leurs propres DTO, et
# rien de ce SDK n'entre dans le graphe de :app.
anthropicJava = "2.34.0"

# --- Build inclus -------------------------------------------------------------
# Version des regles detekt maison. Le build composite substitue le projet local
# a cette coordonnee : le numero ne sert qu'a nommer la dependance.
buildLogic = "1.0"

[libraries]

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Le BOM Compose fixe les versions coherentes de tout le groupe androidx.compose :
# les modules ci-dessous sont donc volontairement sans version.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
# Le convertisseur officiel de Square, pas celui de la communaute : il suit les
# paliers de Retrofit, et c'est kotlinx.serialization qui decode -- le meme moteur
# que les routes typees, donc aucun second modele d'objets a tenir.
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-cpp = { module = "io.github.zxing-cpp:android", version.ref = "zxingCpp" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Les plugins de convention de build-logic compilent contre l'API d'AGP, du plugin
# Kotlin, de KSP et de Hilt : pour eux, ce sont des dependances de compilation et
# non des plugins a appliquer. Les version.ref sont celles des entrees [plugins] du
# bas de ce fichier, pour qu'une montee de version ne puisse pas les desaligner.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
detekt-test-utils = { module = "io.gitlab.arturbosch.detekt:detekt-test-utils", version.ref = "detekt" }
hexavore-detekt-rules = { module = "app.hexavore.buildlogic:detekt-rules", version.ref = "buildLogic" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
calendar-compose = { module = "com.kizitonwose.calendar:compose", version.ref = "kizitonwoseCalendar" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropicJava" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Les destinations de navigation sont des data class @Serializable : c'est le
# plugin qui leur fabrique un serialiseur, et donc ce qui rend les routes typees.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
