# -Dfile.encoding=UTF-8 : les messages de build de ce projet sont en francais et
# passent par des consoles Windows dont la page de code par defaut n'est pas UTF-8.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# R generee par module plutot qu'une R globale : c'est ce qui rend le decoupage
# en modules rentable a la compilation.
android.nonTransitiveRClass=true

kotlin.code.style=official

# API 26 est le plancher declare du projet, et Gradle refuse d'en faire un emulateur
# gere sans cet accord explicite. Le refus vise les images anciennes, lentes et mal
# outillees ; il reste qu'une version qu'on dit porter se verifie en l'ouvrant, et que
# les quatre paliers entre 26 et 30 n'avaient jamais ete ouverts.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true

# Le rendu des emulateurs geres, en logiciel.
#
# Sans cette ligne, Gradle lance l'emulateur avec `-gpu auto-no-window`, que les paliers
# recents ne connaissent plus : l'emulateur le refuse, bascule sur `auto`, cherche un GPU
# dans une session sans fenetre et se referme aussitot (valeur de sortie 1). Le message
# qu'il laisse parle de GPU et non de fenetre, ce qui envoie chercher un pilote.
#
# `swiftshader_indirect` rend sur le processeur : plus lent qu'un vrai GPU, et le seul
# mode qui tienne a la fois sans fenetre ici et sur une machine d'integration continue.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
